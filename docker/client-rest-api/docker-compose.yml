services:
  node:
    image: node:24-alpine
    container_name: node
    restart: always
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ../../client:/app
    command: sh -c "npm start"
    # command: sh -c "npm install && npm run build && npm start"
    networks:
      - app-network
networks:
  app-network:
    driver: bridge