services:
  postgres:
    image: postgres
    container_name: otus-java-basic-project-server
    restart: always
    environment:
      POSTGRES_USER: server_user
      POSTGRES_PASSWORD: server_pass
      POSTGRES_DB: server_db
    ports:
      - "15432:5432"
    volumes:
      - server_data:/var/lib/postgresql

volumes:
  server_data: